openapi: 3.1.0
info:
  description: "Branch appointment booking for the fictional Fynbos Bank. Every error\
    \ is an RFC 9457 problem, and every error the API returns on purpose carries a\
    \ stable code, listed in docs/errors.md. Besides the errors each operation lists,\
    \ any operation can return 500 INTERNAL_ERROR or 503 TRY_AGAIN."
  license:
    name: MIT
    url: https://opensource.org/license/mit
  title: BranchBook API
  version: v1
servers:
- description: The origin that serves the app
  url: /
tags:
- description: "The branches customers can book at, and what each offers."
  name: Branches
- description: The slots a service can be booked in at a branch.
  name: Availability
- description: "Book an appointment, and open it again."
  name: Appointments
paths:
  /api/v1/appointments:
    post:
      description: "Books the slot, or answers why not. The confirmation SMS is written\
        \ in the same transaction and shows as PENDING in notifications. Retrying\
        \ with the same Idempotency-Key and the same details returns the same appointment."
      operationId: bookAppointment
      parameters:
      - description: A UUID that identifies this booking; send it again on a retry
        example: 8c4f1a2e-1b3d-4e5f-9a6b-7c8d9e0f1a2b
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
          description: "Booked, or replayed"
          headers:
            Idempotent-Replayed:
              description: true when an earlier request with this key booked it; absent
                otherwise
              schema:
                type: string
                enum:
                - "true"
              style: simple
            Location:
              description: Where the appointment can be opened again
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: a field is missing or malformed, or not\
            \ a field of this request; IDEMPOTENCY_KEY_REQUIRED: the header is missing\
            \ or not a UUID"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "BRANCH_NOT_FOUND: no active branch has that code"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "DUPLICATE_APPOINTMENT: an upcoming appointment for this service\
            \ exists; CUSTOMER_OVERLAP: another appointment at that time exists; SLOT_FULL:\
            \ every seat was just taken, with up to three alternatives"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "SERVICE_NOT_OFFERED_AT_BRANCH; DATE_OUTSIDE_BOOKING_WINDOW,\
            \ SLOT_ON_CLOSED_DAY, SLOT_OUTSIDE_HOURS, SLOT_OFF_GRID, SLOT_WITHIN_LEAD_TIME:\
            \ the start is not a slot; MOBILE_NUMBER_REQUIRED: not a South African\
            \ mobile; IDEMPOTENCY_KEY_REUSED: the key booked different details"
      summary: Book an appointment
      tags:
      - Appointments
  /api/v1/branches:
    get:
      description: Ordered by name.
      operationId: listBranches
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
          description: The active branches
      summary: List the active branches
      tags:
      - Branches
  /api/v1/branches/{code}:
    get:
      description: "Its address, weekly hours and services, the dates that can be\
        \ booked (from today in the branch's time zone, for 30 days), and the closed\
        \ days among them."
      operationId: getBranch
      parameters:
      - description: The branch code
        example: SAN
        in: path
        name: code
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z]{2,8}$"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDetail"
          description: The branch
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: the code is not 2 to 8 letters"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "BRANCH_NOT_FOUND: no active branch has that code"
      summary: Describe one branch
      tags:
      - Branches
  /api/v1/branches/{code}/availability:
    get:
      description: "Slots start at opening time and step by the service's duration,\
        \ end by closing time, and start at least two hours from now. Full slots are\
        \ listed with seatsAvailable 0. A closed day returns no slots and a closedReason."
      operationId: getAvailability
      parameters:
      - description: The branch code
        example: SAN
        in: path
        name: code
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z]{2,8}$"
      - description: The service code
        example: FICA
        in: query
        name: service
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z]{2,12}$"
      - description: "The date, in the branch's time zone"
        example: 2026-10-27
        in: query
        name: date
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
          description: The day's slots
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: the code, the service or the date is missing\
            \ or malformed"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "BRANCH_NOT_FOUND: no active branch has that code"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "SERVICE_NOT_OFFERED_AT_BRANCH: the branch does not offer the\
            \ service; DATE_OUTSIDE_BOOKING_WINDOW: the date is not one of the bookable\
            \ days"
      summary: List one day's slots for one service at one branch
      tags:
      - Availability
components:
  schemas:
    Address:
      type: object
      properties:
        city:
          type: string
        line1:
          type: string
        postalCode:
          type: string
        province:
          type: string
        suburb:
          type: string
      required:
      - city
      - line1
      - postalCode
      - province
      - suburb
    Appointment:
      type: object
      properties:
        branch:
          $ref: "#/components/schemas/AppointmentBranch"
        canCancel:
          type: boolean
          description: True while the appointment is confirmed and has not started
        cancelledAt:
          type:
          - string
          - "null"
          format: date-time
        customer:
          $ref: "#/components/schemas/AppointmentCustomer"
        endsAt:
          type: string
          format: date-time
          example: 2026-10-27T09:45:00+02:00
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        reference:
          type: string
          example: APT-7K3M-9Q2X
          pattern: "^APT-[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$"
        service:
          $ref: "#/components/schemas/AppointmentService"
        startsAt:
          type: string
          format: date-time
          example: 2026-10-27T09:30:00+02:00
        status:
          type: string
          enum:
          - CONFIRMED
          - CHECKED_IN
          - COMPLETED
          - CANCELLED
          - NO_SHOW
      required:
      - branch
      - canCancel
      - cancelledAt
      - customer
      - endsAt
      - notifications
      - reference
      - service
      - startsAt
      - status
    AppointmentBranch:
      type: object
      properties:
        address:
          type: string
          example: "Shop 4, 1 Protea Lane, Sandton, Johannesburg, 2196"
        code:
          type: string
          example: SAN
        name:
          type: string
          example: Sandton Summit Mall
      required:
      - address
      - code
      - name
    AppointmentCustomer:
      type: object
      properties:
        firstName:
          type: string
          example: Nomvula
        lastName:
          type: string
          example: Dlamini
        mobileMasked:
          type: string
          example: 082 *** 0101
      required:
      - firstName
      - lastName
      - mobileMasked
    AppointmentService:
      type: object
      properties:
        code:
          type: string
          example: FICA
        documentsNeeded:
          type: array
          items:
            type: string
        durationMinutes:
          type: integer
          format: int32
          example: 15
        name:
          type: string
          example: Update personal details (FICA)
      required:
      - code
      - documentsNeeded
      - durationMinutes
      - name
    Availability:
      type: object
      properties:
        branchCode:
          type: string
          example: SAN
        closedReason:
          type:
          - string
          - "null"
          description: Why the branch is closed that day; null if it trades
          enum:
          - CLOSED_DAY
          - PUBLIC_HOLIDAY
          - null
        date:
          type: string
          format: date
          example: 2026-10-27
        generatedAt:
          type: string
          format: date-time
          description: "When the answer was computed, so a page can tell how fresh\
            \ it is"
          example: 2026-10-26T10:05:12+02:00
        holidayName:
          type:
          - string
          - "null"
          description: The holiday's name when closedReason is PUBLIC_HOLIDAY; otherwise
            null
          example: Day of Reconciliation
        serviceCode:
          type: string
          example: FICA
        slots:
          type: array
          description: "The day's slots in time order. Empty on a closed day, and\
            \ once every slot left today starts within the lead time."
          items:
            $ref: "#/components/schemas/Slot"
        timezone:
          type: string
          description: "The branch's IANA time zone, whose offset every instant carries"
          example: Africa/Johannesburg
      required:
      - branchCode
      - closedReason
      - date
      - generatedAt
      - holidayName
      - serviceCode
      - slots
      - timezone
    BookingCustomer:
      type: object
      properties:
        firstName:
          type: string
          example: Nomvula
          minLength: 1
        lastName:
          type: string
          example: Dlamini
          minLength: 1
        mobile:
          type: string
          description: "A South African mobile number, such as 082 555 0101 or +27\
            \ 82 555 0101"
          example: 082 555 0101
      required:
      - firstName
      - lastName
      - mobile
    BookingRequest:
      type: object
      properties:
        branchCode:
          type: string
          example: SAN
          pattern: "^[A-Za-z]{2,8}$"
        customer:
          $ref: "#/components/schemas/BookingCustomer"
        serviceCode:
          type: string
          example: FICA
          pattern: "^[A-Za-z]{2,12}$"
        startsAt:
          type: string
          format: date-time
          example: 2026-10-27T09:30:00+02:00
      required:
      - branchCode
      - customer
      - serviceCode
      - startsAt
    BranchDetail:
      type: object
      properties:
        address:
          $ref: "#/components/schemas/Address"
        bookableFrom:
          type: string
          format: date
          example: 2026-10-26
        bookableTo:
          type: string
          format: date
          example: 2026-11-24
        closedDates:
          type: array
          items:
            $ref: "#/components/schemas/ClosedDate"
        code:
          type: string
          example: SAN
        name:
          type: string
          example: Sandton Summit Mall
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        services:
          type: array
          items:
            $ref: "#/components/schemas/BranchService"
        smsName:
          type: string
          example: Sandton Summit
        timezone:
          type: string
          example: Africa/Johannesburg
      required:
      - address
      - bookableFrom
      - bookableTo
      - closedDates
      - code
      - name
      - operatingHours
      - services
      - smsName
      - timezone
    BranchList:
      type: object
      properties:
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchSummary"
      required:
      - branches
    BranchService:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        documentsNeeded:
          type: array
          items:
            type: string
        durationMinutes:
          type: integer
          format: int32
        name:
          type: string
      required:
      - code
      - description
      - documentsNeeded
      - durationMinutes
      - name
    BranchSummary:
      type: object
      properties:
        city:
          type: string
        code:
          type: string
        name:
          type: string
        opensSunday:
          type: boolean
        province:
          type: string
        suburb:
          type: string
      required:
      - city
      - code
      - name
      - opensSunday
      - province
      - suburb
    ClosedDate:
      type: object
      properties:
        date:
          type: string
          format: date
          example: 2026-12-16
        name:
          type:
          - string
          - "null"
          example: Day of Reconciliation
        reason:
          type: string
          enum:
          - CLOSED_DAY
          - PUBLIC_HOLIDAY
      required:
      - date
      - name
      - reason
    Notification:
      type: object
      properties:
        attempts:
          type: integer
          format: int32
          maximum: 5
          minimum: 0
        body:
          type: string
        channel:
          type: string
          enum:
          - SMS
          - EMAIL
        failureReason:
          type:
          - string
          - "null"
          enum:
          - DELIVERY_FAILED
          - SUPERSEDED_BY_CANCELLATION
          - RECIPIENT_DAILY_CAP
          - DISPATCH_ERROR
          - null
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - CONFIRMATION
          - CANCELLATION
        recipientMasked:
          type: string
          example: 082 *** 0101
        sentAt:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
      required:
      - attempts
      - body
      - channel
      - failureReason
      - id
      - kind
      - recipientMasked
      - sentAt
      - status
    OperatingHours:
      type: object
      properties:
        closesAt:
          type: string
          example: 17:00
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
        opensAt:
          type: string
          example: 08:00
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
        weekday:
          type: integer
          format: int32
          example: 1
          maximum: 7
          minimum: 1
      required:
      - closesAt
      - opensAt
      - weekday
    Problem:
      type: object
      description: "An RFC 9457 problem. The web app chooses its wording from code,\
        \ never detail."
      properties:
        alternatives:
          type: array
          description: "For SLOT_FULL: up to three other slots"
          items:
            type: object
            properties:
              endsAt:
                type: string
                format: date-time
                description: When it ends
              startsAt:
                type: string
                format: date-time
                description: When the alternative slot starts
            required:
            - endsAt
            - startsAt
        code:
          type: string
          description: "The stable error code, one of those in docs/errors.md. Absent\
            \ only on HTTP-level failures the API never returns on purpose: 404 for\
            \ a path it does not serve, 405, 406 and 415"
          enum:
          - VALIDATION_FAILED
          - IDEMPOTENCY_KEY_REQUIRED
          - BRANCH_NOT_FOUND
          - APPOINTMENT_NOT_FOUND
          - MESSAGE_NOT_FOUND
          - SERVICE_NOT_OFFERED_AT_BRANCH
          - DATE_OUTSIDE_BOOKING_WINDOW
          - SLOT_ON_CLOSED_DAY
          - SLOT_OUTSIDE_HOURS
          - SLOT_OFF_GRID
          - SLOT_WITHIN_LEAD_TIME
          - MOBILE_NUMBER_REQUIRED
          - IDEMPOTENCY_KEY_REUSED
          - DUPLICATE_APPOINTMENT
          - CUSTOMER_OVERLAP
          - SLOT_FULL
          - TOO_LATE_TO_CANCEL
          - LOOKUP_RATE_LIMITED
          - INTERNAL_ERROR
          - TRY_AGAIN
        correlationId:
          type: string
          description: Matches the X-Correlation-Id header and the server logs
        detail:
          type: string
          description: A plain-language explanation; never quotes the request
        errors:
          type: array
          description: "For VALIDATION_FAILED, MOBILE_NUMBER_REQUIRED and the slot\
            \ codes: what is wrong with each field"
          items:
            type: object
            properties:
              code:
                type: string
                description: "The rule it broke, for example PATTERN"
              field:
                type:
                - string
                - "null"
                description: "The field, parameter or header with the problem"
              message:
                type:
                - string
                - "null"
                description: A short explanation that never quotes the value
            required:
            - code
            - field
            - message
        instance:
          type: string
          description: "urn:branchbook:request: followed by the correlation id"
        status:
          type: integer
          description: The HTTP status
        title:
          type: string
          description: "A short, plain-language title"
        type:
          type: string
          description: "urn:branchbook:problem: followed by the code; absent, meaning\
            \ about:blank, when there is no code"
      required:
      - correlationId
      - instance
      - status
      - title
    Slot:
      type: object
      properties:
        endsAt:
          type: string
          format: date-time
          example: 2026-10-27T09:45:00+02:00
        seatsAvailable:
          type: integer
          format: int32
          description: "The seats still free; 0 means full, and the slot is still\
            \ listed"
          example: 2
          minimum: 0
        startsAt:
          type: string
          format: date-time
          example: 2026-10-27T09:30:00+02:00
      required:
      - endsAt
      - seatsAvailable
      - startsAt
