.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.t.mono{font-size:13px}.s.mono,.l.mono{font-size:12px}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.halo-2{paint-order:stroke;stroke:var(--surface-2);stroke-width:4px;stroke-linejoin:round}
.pill-built{fill:var(--accent-soft)}.pill-built-t{fill:var(--accent-strong);font-size:12px;font-weight:600}
.pill-plan{fill:var(--surface);stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 2}.pill-plan-t{fill:var(--ink-2);font-size:12px;font-weight:600}
.pill-warn{fill:var(--warn-soft)}.pill-warn-t{fill:var(--warn);font-size:12px;font-weight:600}
.pill-bad{fill:var(--bad-soft)}.pill-bad-t{fill:var(--bad);font-size:12px;font-weight:600}
.badge{fill:var(--accent)}.badge-t{fill:var(--surface);font-size:12px;font-weight:700}
.aws-compute{fill:#ED7100}.aws-db{fill:#C925D1}.aws-net{fill:#8C4FFF}.aws-sec{fill:#DD344C}.aws-mgmt{fill:#E7157B}.aws-store{fill:#7AA116}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ah-acc" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-acc" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ah-dash" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-dash" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-bad" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="959" height="679" rx="16"/>
  <g id="phases">
    <text class="g" x="24" y="40">Before the commit</text>
    <text class="g" x="320" y="40">At the push</text>
    <text class="g" x="512" y="40">After the push</text>
    <text class="g" x="744" y="40">At run time</text>
    <path class="edge" d="M24,60.5 H266"/>
    <text class="l mono" x="312" y="64.5" text-anchor="middle">git commit</text>
    <path class="edge" d="M358,60.5 H412"/>
    <text class="l mono" x="482" y="64.5" text-anchor="end">git push</text>
    <path class="edge" d="M640,60.5 H936" marker-end="url(#ah)"/>
  </g>
  <g id="col-before-the-commit">
    <g id="layer-gitignore">
      <rect class="box" x="24.5" y="88.5" width="279" height="121" rx="8"/>
      <text class="t mono" x="36" y="118">.gitignore</text>
      <text class="s" x="36" y="138">Catches: <tspan class="s mono">.env</tspan> files, keys,</text>
      <text class="s" x="36" y="156">certificates, credentials, <tspan class="s mono">.aws/</tspan>,</text>
      <text class="s" x="36" y="174"><tspan class="s mono">.claude/</tspan>, <tspan class="s mono">cdk.context.json</tspan></text>
      <text class="s" x="36" y="196">Skippable: yes, with <tspan class="s mono">git add -f</tspan></text>
      <circle class="badge" cx="46" cy="88" r="10"/>
      <text class="badge-t" x="46" y="92" text-anchor="middle">1</text>
    </g>
    <g id="hook-pre-commit">
      <rect class="box-soft" x="24.5" y="226.5" width="279" height="425" rx="12"/>
      <text class="g" x="40" y="248">pre-commit hook</text>
      <g id="layer-blocked-file-names">
        <rect class="box" x="36.5" y="270.5" width="255" height="129" rx="8"/>
        <text class="t" x="48" y="300">Blocked file names</text>
        <text class="s" x="48" y="320">Catches, even if force-added:</text>
        <text class="s" x="48" y="338"><tspan class="s mono">.env</tspan> files (not <tspan class="s mono">.env.example</tspan>),</text>
        <text class="s" x="48" y="356">keys, <tspan class="s mono">.claude/</tspan>, <tspan class="s mono">cdk.context.json</tspan></text>
        <rect class="pill-built" x="48.5" y="368.5" width="135" height="19" rx="9.5"/>
        <text class="pill-built-t" x="116" y="382" text-anchor="middle">blocks the commit</text>
        <circle class="badge" cx="58" cy="270" r="10"/>
        <text class="badge-t" x="58" y="274" text-anchor="middle">2</text>
      </g>
      <g id="layer-gitleaks-staged-diff">
        <rect class="box" x="36.5" y="420.5" width="255" height="147" rx="8"/>
        <text class="t" x="48" y="450">gitleaks on the staged diff</text>
        <text class="s" x="48" y="470">Catches: gitleaks defaults, plus</text>
        <text class="s" x="48" y="488">Postgres URLs with a password</text>
        <text class="s" x="48" y="506">and account IDs inside ARNs</text>
        <text class="s" x="48" y="524">(<tspan class="s mono">.gitleaks.toml</tspan>)</text>
        <rect class="pill-built" x="48.5" y="536.5" width="87" height="19" rx="9.5"/>
        <text class="pill-built-t" x="92" y="550" text-anchor="middle">fails closed</text>
        <circle class="badge" cx="58" cy="420" r="10"/>
        <text class="badge-t" x="58" y="424" text-anchor="middle">3</text>
      </g>
      <g id="note-hook-opt-in">
        <path class="box-warn" d="M44.5,580.5 H281.5 L291.5,590.5 V631.5 A8,8 0 0 1 283.5,639.5 H44.5 A8,8 0 0 1 36.5,631.5 V588.5 A8,8 0 0 1 44.5,580.5 Z"/>
        <path class="box-warn" d="M281.5,580.5 V590.5 H291.5 Z"/>
        <text class="s" x="48" y="606"><tspan font-weight="600">Caveat:</tspan> opt-in with <tspan class="s mono">make hooks</tspan>;</text>
        <text class="s" x="48" y="624"><tspan class="s mono">git commit --no-verify</tspan> skips it</text>
      </g>
    </g>
  </g>
  <g id="col-at-the-push">
