      <rect class="box" x="512.5" y="88.5" width="215" height="153" rx="8"/>
      <text class="t" x="524" y="118"><tspan class="t mono">secret-scan</tspan> workflow</text>
      <text class="s" x="524" y="138">Catches: the rules in</text>
      <text class="s" x="524" y="156"><tspan class="s mono">.gitleaks.toml</tspan>, over the</text>
