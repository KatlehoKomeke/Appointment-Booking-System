.ah{fill:var(--ink-2)}.ah-acc{fill:var(--accent)}.ah-dash{fill:var(--ink-3)}.ah-bad{fill:var(--bad)}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
