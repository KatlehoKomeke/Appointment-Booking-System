<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
  <title id="title">Where a secret is stopped</title>
  <desc id="desc">Where a secret is stopped, in four phases read left to right along a time line from git commit to git push and on to run time; a dotted rule after git push is labelled public from here. Before the commit, on the laptop. 1, .gitignore catches .env files, keys, certificates, credentials, .aws/, .claude/ and cdk.context.json; it can be skipped with git add -f. Steps 2 and 3 form the pre-commit hook. 2, blocked file names: .env files (not .env.example), keys, .claude/ and cdk.context.json, even if force-added; it blocks the commit. 3, gitleaks on the staged diff: the gitleaks default rules plus Postgres URLs with a password and account IDs inside ARNs, from .gitleaks.toml; it fails closed. Caveat: the hook is opt-in with make hooks, and git commit --no-verify skips it. At the push. 4, GitHub push protection catches known provider token formats only, not the custom rules in .gitleaks.toml; it can be skipped only by a bypass recorded on GitHub; it blocks the push. Public from here. After the push. 5, the secret-scan workflow runs the rules in .gitleaks.toml over the full history after every push and pull request; it cannot block a push, because the code is already public when it runs, but it is a required check for main, so a finding blocks a merge. 6, GitHub secret scanning catches provider tokens anywhere in the history and raises alerts. 7, the CI log check, job stack of workflow ci, looks for password or local-dev-only in the app and db logs and fails ci. At run time. 8, no AWS access keys: sign-in through OpenID Connect, sessions of at most 1 h, the role ARN in a secret of environment aws-demo, and the account ID masked in workflow logs. 9, Secrets Manager, on the hosted demo: the database credentials and the SMS daily cap's key, generated by AWS and injected into the task at its start. Legend: built, gap or caveat.</desc>
  <!--
    Diagram id: secret-layers
    Shown in: SECURITY.md (Secrets)
    Sources: .gitignore; .githooks/pre-commit; .gitleaks.toml; Makefile (hooks);
      .github/workflows/secret-scan.yml; .github/workflows/ci.yml (job stack, step 'Check that the logs hold no
      credentials'); compose.yaml (services app and db); .github/workflows/ci.yml (job deploy) and
      aws-connection-check.yml (environment aws-demo, role-to-assume, mask-aws-account-id);
      infra/lib/account-stack.ts (maxSessionDuration); infra/lib/data-stack.ts (the generated secrets
      branchbook/database and branchbook/sms-cap-key); infra/lib/app-stack.ts (the task's secrets DB_USER,
      DB_PASSWORD and BRANCHBOOK_SMS_RECIPIENT_CAP_KEY); GitHub settings read with
      gh api repos/KatlehoKomeke/Appointment-Booking-System, field security_and_analysis
      (secret scanning and push protection enabled, non-provider patterns disabled),
      gh api .../environments/aws-demo/secrets with jq '.secrets[].name' (AWS_DEPLOY_ROLE_ARN),
      and gh api .../rulesets (the ruleset Protect main requires the check gitleaks, so step 5 blocks a merge
      but never the push it runs after).
    Verified at 21798b6 (2026-10-27)
    Conventions: docs/assets/diagrams/README.md
    Planned elements carry class="planned" data-milestone; none is left in this diagram.
  -->
