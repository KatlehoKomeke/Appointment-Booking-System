      <text class="t" x="524" y="432">CI log check</text>
      <text class="s mono" x="524" y="450">ci / stack</text>
      <text class="s" x="524" y="470">Catches: <tspan class="s mono">password</tspan> or</text>
      <text class="s" x="524" y="488"><tspan class="s mono">local-dev-only</tspan> in the</text>
      <text class="s" x="524" y="506"><tspan class="s mono">app</tspan> and <tspan class="s mono">db</tspan> logs</text>
      <rect class="box-soft" x="524.5" y="518.5" width="59" height="19" rx="9.5"/>
      <text class="tp" x="554" y="532" text-anchor="middle" font-size="12" font-weight="600">fails ci</text>
      <circle class="badge" cx="534" cy="402" r="10"/>
      <text class="badge-t" x="534" y="406" text-anchor="middle">7</text>
    </g>
  </g>
  <g id="col-at-run-time">
