      <text class="t" x="332" y="118">GitHub push</text>
      <text class="t" x="332" y="137">protection</text>
      <text class="s" x="332" y="157">Catches: known</text>
      <text class="s" x="332" y="175">provider token</text>
      <text class="s" x="332" y="193">formats only; not</text>
      <text class="s" x="332" y="211">the custom rules in</text>
      <text class="s" x="332" y="229"><tspan class="s mono">.gitleaks.toml</tspan></text>
      <text class="s" x="332" y="251">Skippable: only by</text>
