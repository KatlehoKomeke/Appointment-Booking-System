.box-soft{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1}
.box-dash{fill:none;stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:5 4}
.box-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5}
.box-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
.edge{stroke:var(--ink-2);stroke-width:1.4;fill:none}
.edge-acc{stroke:var(--accent);stroke-width:2.2;fill:none}
.edge-dash{stroke:var(--ink-3);stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.edge-bad{stroke:var(--bad);stroke-width:1.6;fill:none}
.probe{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:1.5 3;fill:none}
