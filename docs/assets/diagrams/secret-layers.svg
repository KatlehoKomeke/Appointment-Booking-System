      <text class="tp" x="551" y="360" text-anchor="middle" font-size="12" font-weight="600">alerts</text>
      <circle class="badge" cx="534" cy="266" r="10"/>
      <text class="badge-t" x="534" y="270" text-anchor="middle">6</text>
