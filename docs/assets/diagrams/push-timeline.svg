<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 768" width="960" height="768" role="img" aria-labelledby="title desc" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
  <title id="title">One push to main, measured</title>
  <desc id="desc">Gantt chart of one push to main, measured on the push of c5feafe on 25 October 2026 from the GitHub Actions API. Time runs left to right, in seconds after GitHub created the runs at 12:40:13Z; jobs run top to bottom, grouped by workflow. Workflow ci (ci.yml, on push to main). Job web runs from 2 to 27 s (25 s): check:api, lint, typecheck, format:check, test in UTC and in New York, build. Job stack runs from 2 to 62 s (60 s): docker compose up --build --wait, scripts/smoke.sh, then a check that the logs hold no credentials. Job api runs from 3 to 100 s (97 s): ./mvnw verify with the unit tests, the ArchUnit rules, the integration tests on PostgreSQL 17 and the contract check, then the unit and API tests again in New York, then scripts/check-test-refs.sh. Workflow deploy (deploy.yml, on push to main) has no link to ci and does not wait for it. Its job test runs from 2 to 27 s (25 s): lint, tsc and jest on the CDK app. The main path, needs: test, runs from the end of test to the start of job deploy, which runs from 30 to 87 s (57 s). deploy is the only job in this push with AWS access, in af-south-1: environment aws-demo, an OIDC sign-in with no stored keys, cdk deploy BranchbookRelease, then it verifies /branchbook/release. Workflow secret-scan (secret-scan.yml, on every push). Job gitleaks runs from 3 to 11 s (8 s) and scans the full history. Workflow infra (infra.yml, only when infra/** or infra.yml changes). Job test-and-synth did not run: this push changed nothing under infra/. All six jobs that ran passed. deploy was done at 12:41:40Z and ci at 12:41:53Z. Gap: deploy finished 13 s before ci. It waits for its own test job, never for ci. This is the job structure before the deploy job joined ci, measured at c5feafe: since then ci has gained the jobs infra and deploy, which needs api, web, stack and infra, and deploy.yml and infra.yml are gone; the push is re-measured after the first pipeline run.</desc>
  <!--
    Diagram id: push-timeline
    Shown in: docs/delivery.md (One push, measured)
    Sources: .github/workflows/ci.yml, .github/workflows/deploy.yml, .github/workflows/secret-scan.yml,
      .github/workflows/infra.yml, .github/workflows/aws-connection-check.yml (run by hand, so not in a push),
      web/package.json, infra/package.json, api/pom.xml,
      api/src/test/java/za/co/fynbos/branchbook/ArchitectureTest.java,
      api/src/test/java/za/co/fynbos/branchbook/shared/web/OpenApiContractIT.java,
      api/src/test/java/za/co/fynbos/branchbook/support/TestcontainersConfiguration.java;
      GitHub Actions API, runs 40194135208 (ci), 40194135199 (deploy) and 40194135188 (secret-scan):
        gh api "repos/KatlehoKomeke/Appointment-Booking-System/actions/runs?head_sha=$(git rev-parse c5feafe)"
          -q '.workflow_runs[] | {name, id, created_at, updated_at, conclusion}'
        gh api repos/KatlehoKomeke/Appointment-Booking-System/actions/runs/RUN/jobs
          -q '.jobs[] | {name, started_at, completed_at, conclusion}'
      (-q is the short form of gh's jq option, spelled out here because an XML comment cannot hold a double
      hyphen: each call prints only the fields named, never an account ID.)
      Offsets are seconds after the runs' created_at, 12:40:13Z. Every job concluded success. No infra run:
      git diff ef8a729 c5feafe touches nothing under infra/ or .github/workflows/infra.yml.
    Measured on the push of c5feafe, 25 October 2026: a dated measurement; re-measure rather than edit.
    Shows the job structure before the deploy job joined ci (deploy.yml and infra.yml, both since deleted;
    ci.yml now has the jobs infra and deploy, the latter with needs: [api, web, stack, infra]). Not redrawn:
    re-measured after the first pipeline run from main.
    Verified at 21798b6 (2026-10-27): the measurement is unchanged; only this note and the description are new
    Conventions: docs/assets/diagrams/README.md
    Planned elements carry class="planned" data-milestone (this diagram has none)
  -->
