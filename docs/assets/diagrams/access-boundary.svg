<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 792" width="960" height="792" role="img" aria-labelledby="title desc" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
  <title id="title">Who can change what in AWS</title>
  <desc id="desc">Who can change what in AWS. Everything shown is built. Left, the administrator, by hand. Step A: the IAM user branchbook-admin signs in with aws login and runs the CDK app with BRANCHBOOK_ALERT_EMAIL set, so the app includes BranchbookAccount; that switch is enforced by code and workflow. cdk deploy goes through the us-east-1 CDK bootstrap roles, cdk-hnb659fds-*-us-east-1, to the stack BranchbookAccount in us-east-1, which holds the OIDC provider, the budget and the deploy role branchbook-github-deploy. Right, the pipeline, on every push to main: ci.yml, job deploy, passes four guards in order; aws-connection-check.yml, run by hand, also declares aws-demo. Step 1, environment aws-demo: only branch main and v* tags may use it; enforced by a GitHub setting. Step 2, the trust policy, an exact match (StringEquals): aud must equal sts.amazonaws.com, and sub must name this repository by its ID and the environment aws-demo; enforced by IAM. Step 3, the deploy role: its sessions last at most 1 hour, and its policy has two statements, AssumeCdkBootstrapRolesOnly, which allows sts:AssumeRole on cdk-hnb659fds-*, and ReadReleaseRecordOnly, which allows ssm:GetParameter on /branchbook/release; enforced by IAM. Step 4, the CDK app without BRANCHBOOK_ALERT_EMAIL: ci.yml never sets it, so the app never holds BranchbookAccount; enforced by code and workflow. Step 5: via the af-south-1 bootstrap roles and CloudFormation, the pipeline deploys BranchbookData, BranchbookApp and BranchbookRelease in af-south-1: the hosted demo, then /branchbook/release, the SSM parameter holding the deployed commit. A red arrow with a cross runs from step 4 to BranchbookAccount: not allowed, because BranchbookAccount is not in the pipeline’s CDK app. Gap, not prevented by IAM today: AssumeCdkBootstrapRolesOnly allows cdk-hnb659fds-*, which also matches the us-east-1 bootstrap roles; the cfn-exec bootstrap role keeps CDK’s default AdministratorAccess, because the documented bootstrap omits --cloudformation-execution-policies; main requires no review, so a workflow pushed to main that set BRANCHBOOK_ALERT_EMAIL could deploy BranchbookAccount; what limits this today is one collaborator, who is an admin, and the aws-demo branch policy. Legend: built, main path, refused or not allowed, gap or caveat; the pill on each guard names what enforces it: IAM, a GitHub setting, or code and workflow.</desc>
  <!--
    Diagram id: access-boundary
    Shown in: infra/README.md (Who can change what in AWS)
    Sources: infra/bin/branchbook.ts (BRANCHBOOK_ALERT_EMAIL switch, stacks and Regions);
      infra/lib/account-stack.ts (OIDC provider, trust policy, AssumeCdkBootstrapRolesOnly, ReadReleaseRecordOnly,
      1 h sessions, budget); infra/lib/release-stack.ts (/branchbook/release); infra/test/account-stack.test.ts;
      .github/workflows/ci.yml (job deploy, environment aws-demo, never sets BRANCHBOOK_ALERT_EMAIL, deploys
      BranchbookData, BranchbookApp and BranchbookRelease);
      .github/workflows/aws-connection-check.yml (also declares aws-demo); infra/README.md (BranchbookAccount
      deployed by an administrator by hand, branchbook-admin, aws login, the documented cdk bootstrap, which omits
      cloudformation-execution-policies);
      GitHub settings, read with fields selected (-q is the short form of the jq flag) so no account ID prints:
        gh api repos/KatlehoKomeke/Appointment-Booking-System/environments/aws-demo
          -q '[.protection_rules[].type], .deployment_branch_policy'
        gh api repos/KatlehoKomeke/Appointment-Booking-System/environments/aws-demo/deployment-branch-policies
          -q '.branch_policies[] | [.name, .type]'
        gh api repos/KatlehoKomeke/Appointment-Booking-System/branches/main/protection -q '.url'   (404: no classic rule; the ruleset applies)
        gh api repos/KatlehoKomeke/Appointment-Booking-System/rulesets -q 'length'      (1: Protect main)
        gh api repos/KatlehoKomeke/Appointment-Booking-System/collaborators -q '[.[] | .permissions.admin]'
    Verified at 21798b6 (2026-10-27)
    Conventions: docs/assets/diagrams/README.md
    Planned elements carry class="planned" data-milestone. This diagram has none: everything shown is built.
  -->
