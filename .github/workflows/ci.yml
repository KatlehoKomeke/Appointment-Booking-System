# .github/workflows/ci.yml
#
# Builds and tests the application on every push to main and every pull request, and deploys it from main. Four jobs
# run in parallel:
#
# - api:   `./mvnw verify` on JDK 25. Compiler and Javadoc lint, unit tests, integration tests on a real
#          PostgreSQL 17 (Testcontainers), the formatting check, the OpenAPI contract check (docs/openapi.yaml must be
#          what the API generates) and the coverage report. The unit tests and the API tests then run again in
#          America/New_York, because slot times must not depend on the JVM's zone. Last,
#          scripts/check-test-refs.sh: every rule in docs/domain-rules.md has a status and a proof, and every test
#          that a proven rule or README.md cites exists, unless README.md marks it as planned.
# - web:   the API types must be what docs/openapi.yaml generates; then lint, type check, format check, unit tests
#          in two time zones, and the production build.
# - stack: builds the Docker image and starts it with PostgreSQL through docker compose, exactly as `make up` does on
#          a reviewer's machine. It then runs scripts/smoke.sh, the Playwright end-to-end tests in e2e/ at 390 and
#          1280 px (failing on any CSP violation or console error), the smoke test again, and the 409 race
#          (scripts/demo-409.sh), and checks that the logs hold no credentials. A failed run keeps the end-to-end
#          report, its traces and the stack's logs as artifacts.
# - infra: lints, type-checks and unit-tests the AWS CDK app in infra/, then synthesises every stack. It needs no AWS
#          credentials: the tests assert on the generated CloudFormation, and synth never calls AWS.
#
# On a push to main, once all four are green, one more job runs (docs/adr/0007-continuous-deployment-from-main.md):
#
# - deploy: signs in to AWS through OpenID Connect (no stored keys) as the role in the aws-demo environment, builds
#           the ARM64 image on an ARM runner, deploys the hosted demo's two stacks with `cdk deploy`, smoke-tests the
#           live address, and only then records the commit in BranchbookRelease and reads it back. A red check above
#           means no deployment.
#
# The first four jobs only read the repository and have no access to AWS. The pipeline never sets
# BRANCHBOOK_ALERT_EMAIL, so it cannot synthesise or change BranchbookAccount, the stack that grants it access (see
# infra/bin/branchbook.ts). Account IDs are masked in the public logs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it makes obsolete. On main, runs queue instead, so a
# deployment in progress is never interrupted: at most one run waits, and a newer push replaces the waiting one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and run every check
        run: ./mvnw -B -ntp verify

      # The runner's zone is UTC, like the containers'. Slots are computed in the branch's zone, so the unit tests
      # and the API tests must also pass in a zone with a negative offset and daylight saving time (BR-20).
      - name: Unit tests and API tests in America/New_York
        run: ./mvnw -B -ntp verify -Dit.test='*ApiIT' -Djacoco.skip=true
        env:
          TZ: America/New_York

      - name: Check that the tests the README and the proven domain rules cite exist
        working-directory: .
        run: scripts/check-test-refs.sh

      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the pinned dependencies
        run: npm ci

      # src/api/schema.d.ts is generated from the committed contract and committed itself, so a reviewer can read
      # it. Regenerating it must change nothing (ADR-0005).
      - name: Check that the API types match docs/openapi.yaml
        run: npm run check:api

      - name: Lint, including TSDoc and accessibility rules
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests in UTC
        run: npm test
        env:
          TZ: UTC

      # Appointment times must render in South African time on any device, so the tests also run in a zone with a
      # negative offset and daylight saving time.
      - name: Unit tests in America/New_York
        run: npm test
        env:
          TZ: America/New_York

      - name: Production build
        run: npm run build

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # compose.yaml commits no database password, so each run makes its own: random, masked in the log, and looked
      # for in the logs below.
      - name: Make a random database password for this run
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build the image and start the stack, as make up does
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke-test the running application
        run: scripts/smoke.sh http://127.0.0.1:8080

      # The end-to-end tests drive the same stack in Chromium, at 390 and 1280 px, failing on any CSP violation or
      # console error (e2e/README.md). The browser is cached by Playwright's version, so it downloads only when that
      # changes.
      - name: Set up Node.js for the end-to-end tests
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the end-to-end test dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache the Playwright browser
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium for Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Run the end-to-end tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test

      # A second smoke run after the end-to-end bookings proves the app still answers as it did on a fresh start.
      - name: Smoke-test the running application again
        run: scripts/smoke.sh http://127.0.0.1:8080

      - name: Race twenty bookings for the last seat (make demo-409)
        run: scripts/demo-409.sh http://127.0.0.1:8080

      - name: Keep the end-to-end report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

      - name: Check that the logs hold no credentials
        run: |
          if docker compose logs app db | grep --ignore-case --fixed-strings --regexp password --regexp "$DB_PASSWORD"; then
            echo "A log line above mentions a credential." >&2
            exit 1
          fi

      - name: Show the logs of a failed run
        if: failure()
        run: docker compose logs --no-color | tee compose.log

      - name: Keep the stack's logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose.log
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install the pinned dependencies
        run: npm ci

      - name: Lint, including TSDoc on every export
        run: npm run lint

      - name: Type-check
        run: npm run build

      - name: Unit-test the synthesised templates
        run: npm test -- --ci

      - name: Synthesise every stack
        # A placeholder address: the real one is supplied only when deploying, never committed. With the flag, it
        # brings BranchbookAccount and the hosted demo's two stacks into the app.
        env:
          BRANCHBOOK_ALERT_EMAIL: alerts@example.com
          BRANCHBOOK_HOSTED_DEMO: 'true'
        run: npx cdk synth --quiet

  deploy:
    # A push to main, or a manual run; never a pull request. The aws-demo environment then admits only main and v*
    # tags, so a manual run from any other ref stops here, before a token is issued.
    if: github.event_name != 'pull_request'
    needs: [api, web, stack, infra]
    # The Fargate task is ARM64, so the image is built on an ARM runner: no emulation, and the same build as a
    # developer's Apple-silicon machine.
    runs-on: ubuntu-24.04-arm
    environment: aws-demo
    timeout-minutes: 40
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token for AWS
      contents: read
    # Deployments queue rather than cancel each other, so a half-finished deployment is never interrupted.
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install the pinned dependencies
        run: npm ci

      - name: Sign in to AWS through OpenID Connect
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: af-south-1
          mask-aws-account-id: true

      # The data stack first, then the app stack, whose image is built here and pushed to the bootstrap repository.
      # The alarms' e-mail address is personal data, so it comes from an environment secret when one is set; without
      # it the alarms still exist, on a topic with no subscriber.
      - name: Deploy the hosted demo
        env:
          BRANCHBOOK_HOSTED_DEMO: 'true'
          BRANCHBOOK_DEMO_ALERT_EMAIL: ${{ secrets.BRANCHBOOK_DEMO_ALERT_EMAIL }}
        run: npx cdk deploy BranchbookData BranchbookApp --require-approval never --ci --progress events

      # The same checks a reviewer's `make smoke` runs, against the live address: the new task answers behind the
      # load balancer, with every security header, before this commit is recorded as deployed.
      - name: Smoke-test the hosted demo
        working-directory: .
        run: scripts/smoke.sh "https://$(node -p "require('./infra/cdk.json').context.demoDomain")"

      - name: Record the deployed commit
        run: npx cdk deploy BranchbookRelease --require-approval never --ci --progress events

      - name: Verify the recorded commit
        run: |
          deployed="$(aws ssm get-parameter --name /branchbook/release --query Parameter.Value --output text)"
          if [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "AWS records $deployed, expected $GITHUB_SHA" >&2
            exit 1
          fi
          echo "AWS af-south-1 now records commit $deployed"
