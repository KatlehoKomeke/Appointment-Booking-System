# .github/workflows/ci.yml
#
# Builds and tests the application on every push to main and every pull request. Three jobs run in parallel:
#
# - api:   `./mvnw verify` on JDK 25. Compiler and Javadoc lint, unit tests, integration tests on a real
#          PostgreSQL 17 (Testcontainers), the formatting check and the coverage report. Then
#          scripts/check-test-refs.sh: every rule in docs/domain-rules.md has a status and a proof, and every test
#          that a proven rule or README.md cites exists, unless README.md marks it as planned.
# - web:   lint, type check, format check, unit tests in two time zones, and the production build.
# - stack: builds the Docker image and starts it with PostgreSQL through docker compose, exactly as `make up` does on
#          a reviewer's machine. It then runs scripts/smoke.sh and checks that the logs hold no credentials.
#
# The workflow only reads the repository. It uses no secrets and has no access to AWS.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and run every check
        run: ./mvnw -B -ntp verify

      - name: Check that the tests the README and the proven domain rules cite exist
        working-directory: .
        run: scripts/check-test-refs.sh

      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the pinned dependencies
        run: npm ci

      - name: Lint, including TSDoc and accessibility rules
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests in UTC
        run: npm test
        env:
          TZ: UTC

      # Appointment times must render in South African time on any device, so the tests also run in a zone with a
      # negative offset and daylight saving time.
      - name: Unit tests in America/New_York
        run: npm test
        env:
          TZ: America/New_York

      - name: Production build
        run: npm run build

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image and start the stack, as make up does
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke-test the running application
        run: scripts/smoke.sh http://127.0.0.1:8080

      - name: Check that the logs hold no credentials
        run: |
          if docker compose logs app db | grep --ignore-case --extended-regexp 'password|local-dev-only'; then
            echo "A log line above mentions a credential." >&2
            exit 1
          fi

      - name: Show the logs of a failed run
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
