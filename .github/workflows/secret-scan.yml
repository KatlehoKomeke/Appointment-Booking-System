# .github/workflows/secret-scan.yml
#
# Scans the full git history for secrets on every push and pull request.
# It complements the local pre-commit hook (.githooks/pre-commit), which a contributor can skip;
# this check cannot be skipped. Configuration: .gitleaks.toml. The gitleaks image is pinned by digest in
# .github/tools/compose.yaml, where Dependabot updates it.

name: secret-scan

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every commit with gitleaks
        run: >-
          docker compose --file .github/tools/compose.yaml run --rm gitleaks
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
