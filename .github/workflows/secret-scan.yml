# .github/workflows/secret-scan.yml
#
# Scans the full git history for secrets on every push and pull request.
# It complements the local pre-commit hook (.githooks/pre-commit), which a contributor can skip;
# this check cannot be skipped. Configuration: .gitleaks.toml.

name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan every commit with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
