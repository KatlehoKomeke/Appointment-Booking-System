# .github/workflows/deploy.yml
#
# Continuous deployment: every push to main is tested, deployed to AWS and verified
# (docs/adr/0007-continuous-deployment-from-main.md).
#
# - test:   type-checks and unit-tests the CDK app; nothing reaches AWS if this fails.
# - deploy: signs in to AWS through OpenID Connect (no stored keys) using the role in the aws-demo environment, runs
#           `cdk deploy` for the workload stacks, then reads back the recorded release to prove the new commit is live.
#
# The pipeline never sets BRANCHBOOK_ALERT_EMAIL, so it cannot synthesise or change BranchbookAccount, the stack that
# grants it access (see infra/bin/branchbook.ts). Account IDs are masked in the public logs.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue rather than cancel each other, so a half-finished deploy is never interrupted.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install the pinned dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Unit-test the synthesised templates
        run: npm test -- --ci

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: aws-demo
    timeout-minutes: 30
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token for AWS
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install the pinned dependencies
        run: npm ci

      - name: Sign in to AWS through OpenID Connect
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: af-south-1
          mask-aws-account-id: true

      - name: Deploy the workload stacks
        run: npx cdk deploy BranchbookRelease --require-approval never --ci --progress events

      - name: Verify the deployed commit
        run: |
          deployed="$(aws ssm get-parameter --name /branchbook/release --query Parameter.Value --output text)"
          if [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "AWS records $deployed, expected $GITHUB_SHA" >&2
            exit 1
          fi
          echo "AWS af-south-1 now records commit $deployed"
